<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kixora Wholesale Invoice</title>
<style>
:root{--bg:#F3F4F7;--card:#fff;--ink:#14213D;--mute:#667085;--line:#DDE1E8;--navy:#7A3508;--acc:#B84F08;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F141C;--card:#18202B;--ink:#EEF1F5;--mute:#9AA4B2;--line:#2A3441;--navy:#F5B98A;--acc:#F0955A}}
:root[data-theme="dark"]{--bg:#0F141C;--card:#18202B;--ink:#EEF1F5;--mute:#9AA4B2;--line:#2A3441;--navy:#F5B98A;--acc:#F0955A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 40px}
h2{font-size:18px;margin:24px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;min-height:44px}
textarea{min-height:64px;resize:vertical}
.big{min-height:130px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub{color:var(--mute);font-size:14px}
.x{background:none;border:0;color:var(--acc);font-size:14px;cursor:pointer;padding:6px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:500 15px system-ui,sans-serif;cursor:pointer;min-height:44px;flex:1}
.btn.alt{background:transparent;color:var(--navy);border:1px solid var(--line)}
.btns{display:flex;gap:10px;margin-top:12px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px}
.chk input{width:22px;min-height:22px;height:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60}
#fit{width:100%;overflow:hidden;border-radius:6px;box-shadow:0 1px 8px rgba(0,0,0,.18)}
#sheet{width:794px;background:#fff;color:#2B1608;font-family:Arial,Helvetica,sans-serif;font-size:15px;transform-origin:top left;position:relative;isolation:isolate;overflow:hidden}
#sheet .mm,#sheet .info .l b,#sheet .info .r span,#sheet .bx .rw b{color:#B84F08}
#sheet .tb{position:absolute;top:0;left:0;right:0;height:10px;background:#B84F08}
#sheet .wm{position:absolute;left:50%;top:48%;width:520px;transform:translate(-50%,-50%);opacity:.055;z-index:-1;pointer-events:none}
#sheet .hd{display:flex;justify-content:space-between;align-items:center;padding:30px 36px 0}
#sheet .hd img{height:78px}
#sheet .mm{width:340px;text-align:center;border-top:5px solid #B84F08;border-bottom:5px solid #B84F08;font-size:44px;font-weight:700;letter-spacing:6px;padding:6px 0}
#sheet .info{display:flex;padding:22px 36px}
#sheet .info .l{flex:1;border-right:2px solid #B84F08;padding-right:20px;line-height:1.6}
#sheet .info .l b{font-size:24px;display:block;margin-bottom:4px}
#sheet .info .r{flex:1;padding-left:24px}
#sheet .info .r div{display:flex;padding:4px 0}
#sheet .info .r span{width:110px;font-weight:700}
#sheet .info .r em{font-style:normal;flex:1;word-break:break-word}
#sheet .bx{margin:6px 36px 20px;border:1.5px solid #B84F08}
#sheet .bx .t{background:#B84F08;color:#fff;font-weight:700;padding:9px 14px}
#sheet .bx .rw{display:flex;padding:6px 14px}
#sheet .bx .rw b{width:140px}
#sheet table{width:calc(100% - 72px);margin:0 36px;border-collapse:collapse;table-layout:fixed}
#sheet th{background:#B84F08;color:#fff;padding:11px 6px;font-size:14px}
#sheet td{border:1.5px solid #B84F08;padding:10px 12px;vertical-align:top}
#sheet td.a{text-align:right}
#sheet .dt{white-space:pre-wrap;margin-top:0}
#sheet td.sl{text-align:center;font-weight:700;vertical-align:middle}
#sheet tr.tt td{font-size:17px}
#sheet tr.tt td.a{background:#B84F08;color:#fff;font-weight:700;vertical-align:middle}
#sheet .wd{margin:22px 36px;border:1.5px solid #B84F08;padding:12px 16px}
#sheet .sg{display:flex;justify-content:flex-end;padding:6px 36px 10px;min-height:16px}
#sheet .ty{display:flex;align-items:center;gap:16px;padding:10px 36px;font-style:italic;font-weight:700}
#sheet .ty:before,#sheet .ty:after{content:"";flex:1;border-top:3px solid #B84F08}
#sheet .ft{background:#B84F08;color:#fff;display:flex;justify-content:space-between;padding:20px 36px;margin-top:8px;font-size:14px;gap:20px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px}
.ov img{width:100%;max-width:560px;background:#fff;border-radius:4px}
.ovt{color:#fff;font-size:14px;text-align:center}
.ov .btns{width:100%;max-width:560px}
@media print{@page{size:A4;margin:0}body{background:#fff}body::before,.edit,.btns{display:none!important}.wrap{padding:0;max-width:none}#fit{box-shadow:none;height:auto!important;overflow:visible}#sheet{transform:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div class="edit">
<h2>Invoice details</h2>
<div class="card">
<div class="g2"><div><label>CN No. (auto)</label><input id="no" inputmode="numeric"></div><div><label>Currency</label><select id="cur"><option value="BDT">BDT</option><option value="USD">USD</option></select></div></div>
<label>Date</label><input id="dt" type="date">
<label>Buyer name</label><input id="bn">
<div class="g2"><div><label>Country</label><input id="bc"></div><div><label>Contact</label><input id="bt" inputmode="tel"></div></div>
<label>Buyer address</label><textarea id="ba"></textarea>
</div>
<h2>Products</h2>
<div id="items"></div>
<button class="btn alt" style="width:100%" onclick="addItem()">+ Add another product</button>
<h2>Advance payment</h2>
<div class="card"><label>Advance received (for the whole memo)</label><input id="adv" type="number" inputmode="decimal" step="0.01"></div>
<h2>Your company (saved on this phone)</h2>
<div class="card">
<label>Address</label><textarea id="ca" placeholder="Factory or office address"></textarea>
<div class="g2"><div><label>Email</label><input id="ce" type="email"></div><div><label>Phone</label><input id="cp" inputmode="tel"></div></div>
<label class="chk"><input id="stp" type="checkbox" checked> Show company stamp</label>
</div>
</div>
<h2 class="edit">Preview</h2>
<div id="fit"><div id="sheet"></div></div>
<div class="btns"><button class="btn" onclick="dlImage()">Download invoice image</button></div>
<div class="btns"><button class="btn" onclick="copyTxt()">Copy as text</button><button class="btn alt" onclick="window.print()">Print or save PDF</button></div>
<div class="btns"><button class="btn" style="background:var(--navy);color:var(--bg)" onclick="nextMemo()">Done: save and start next invoice</button></div>
</div>
<div id="toast"></div>
